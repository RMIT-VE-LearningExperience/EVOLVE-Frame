name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: student-web

jobs:
  typecheck:
    name: Typecheck (student-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit tests (student-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test lib/*.test.ts

  build:
    name: Static build (student-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  lint:
    # Advisory, not yet required: five pre-existing oxlint errors live in
    # generated components/ui/ files. See docs/decisions/0001. The lint step
    # is allowed to fail so the job reports success with a warning instead of
    # a red check. Make the step strict and the job required once those errors
    # are fixed; never suppress them to get green.
    name: Lint (student-web, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - id: lint
        continue-on-error: true
        run: npm run lint
      - if: steps.lint.outcome == 'failure'
        run: |
          echo "::warning title=Lint advisory::oxlint reported errors. Pre-existing errors are recorded in docs/decisions/0001; new errors are not allowed. See the lint step log."
          echo "### Lint advisory" >> "$GITHUB_STEP_SUMMARY"
          echo "oxlint reported errors (see the lint step log). Pre-existing errors are recorded in docs/decisions/0001-adopt-collaborative-agent-workflow.md. Do not add new ones." >> "$GITHUB_STEP_SUMMARY"
